# Render Blueprint — Render อ่านไฟล์นี้แล้วสร้าง service ให้อัตโนมัติ
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: line-ai-bridge
    runtime: node
    # free = ฟรี แต่หลับเมื่อไม่มี request เข้า 15 นาที
    # จึงต้องมีตัวยิง /health กันหลับ (ดู src/keepalive.js และหัวข้อ "เรื่องเครื่องหลับ" ใน README)
    plan: free
    # สิงคโปร์ใกล้ไทยที่สุด ตอบไวกว่าฝั่งอเมริกาหลายร้อยมิลลิวินาที
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    # Render เรียก path นี้เช็กว่าเวอร์ชันใหม่พร้อมแล้วค่อยสลับ ทำให้ deploy ได้โดยไม่มีช่วงล่ม
    healthCheckPath: /health
    envVars:
      # sync: false = ไม่เก็บค่าไว้ในไฟล์นี้ ต้องไปกรอกเองในหน้า Environment ของ Render
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5
      # medium (ค่าเริ่มต้น) ใช้ ~30 วินาที เกินอายุ replyToken ของ LINE จึงลดเป็น low (~12-15 วินาที)
      - key: OPENAI_REASONING_EFFORT
        value: low
      # Neon Postgres ต้องใช้ฐานข้อมูลภายนอก เพราะแพ็กเกจฟรีล้างไฟล์ทุกครั้งที่ restart
      - key: DATABASE_URL
        sync: false
      # LINE userId ของคนที่สอนบอทได้ คั่นด้วย comma
      - key: TEACHER_USER_IDS
        sync: false
      # รหัสสำหรับเปิดหน้าหนังสือ /book?key=...
      - key: BOOK_KEY
        sync: false
      - key: BOOK_TITLE
        value: สมุดความรู้ SCM
